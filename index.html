<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Antoine Godin Blog</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto",
          "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans",
          "Helvetica Neue", sans-serif;
        line-height: 1.6;
        color: #333;
        background-color: #fff;
        margin: 0;
        padding: 0;
      }

      header {
        background-color: #f5f5f5;
        border-bottom: 1px solid #eee;
        padding: 30px 20px;
        width: 100%;
        margin-bottom: 0;
      }

      header h1 {
        max-width: 800px;
        margin: 0 auto;
        font-size: 2.5em;
        font-weight: 400;
      }

      .content-wrapper {
        max-width: 800px;
        margin: 0 auto;
        padding: 40px 20px;
      }

      h1 {
        font-size: 2.5em;
        margin-bottom: 10px;
        font-weight: 400;
      }

      .subtitle {
        color: #666;
        font-size: 1.1em;
        margin-bottom: 40px;
        font-style: italic;
      }

      nav {
        margin-bottom: 50px;
      }

      nav a {
        color: #333;
        text-decoration: none;
        margin-right: 20px;
        font-size: 1em;
      }

      nav a:hover {
        text-decoration: underline;
      }

      .post-list {
        list-style: none;
      }

      .post-item {
        margin-bottom: 30px;
        padding-bottom: 20px;
        border-bottom: 1px solid #eee;
      }

      .post-item:last-child {
        border-bottom: none;
      }

      .post-date {
        color: #999;
        font-size: 0.9em;
        margin-bottom: 5px;
      }

      .post-title {
        font-size: 1.2em;
        margin-bottom: 8px;
      }

      .post-title a {
        color: #333;
        text-decoration: none;
      }

      .post-title a:hover {
        text-decoration: underline;
      }

      .post-description {
        color: #666;
        font-size: 0.95em;
        line-height: 1.5;
      }

      footer {
        margin-top: 60px;
        padding-top: 20px;
        border-top: 1px solid #eee;
        text-align: center;
        color: #999;
        font-size: 0.9em;
      }

      @media (max-width: 600px) {
        header {
          padding: 20px 15px;
        }

        .content-wrapper {
          padding: 20px 15px;
        }

        header h1 {
          font-size: 2em;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Antoine's Blog</h1>
    </header>

    <div class="content-wrapper">
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
      </nav>

      <main>
        <ul class="post-list">
          <li class="post-item">
            <div class="post-date">Mar 15, 2024</div>
            <div class="post-title">
              <a href="post.html"
                >Building Modern Web Applications: A Journey</a
              >
            </div>
            <div class="post-description">
              Exploring the evolution of web development, from static pages to
              dynamic applications. What makes modern web apps tick, and where
              are we heading?
            </div>
          </li>
        </ul>
      </main>

      <footer>
        <p>© 2025 Antoine</p>
      </footer>
    </div>
  </body>
</html>
